# ============================================================================
# CrewAI Development Environment - Docker Compose
# ============================================================================
# Complete local development stack with all dependencies
#
# Usage:
#   docker-compose up -d          # Start all services
#   docker-compose logs -f crewai # View logs
#   docker-compose down           # Stop all services
#   docker-compose down -v        # Stop and remove volumes
#
# Services:
#   - crewai: Main application
#   - postgres: Database
#   - redis: Caching and rate limiting
#   - prometheus: Metrics collection
#   - grafana: Metrics visualization
# ============================================================================

version: '3.8'

services:
  # ============================================================================
  # CrewAI Application
  # ============================================================================
  crewai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crewai-app
    restart: unless-stopped
    ports:
      - "8000:8000"  # Main API
      - "9090:9090"  # Metrics
    environment:
      # Application
      - ENVIRONMENT=development
      - CREWAI_LOG_LEVEL=DEBUG
      - CREWAI_LOG_FORMAT=json
      - PYTHONUNBUFFERED=1

      # Database
      - DATABASE_URL=postgresql://crewai:crewai_password@postgres:5432/crewai

      # Redis
      - REDIS_URL=redis://redis:6379/0

      # LLM API Keys (replace with your keys)
      - OPENAI_API_KEY=${OPENAI_API_KEY:-your-openai-key-here}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-your-anthropic-key-here}

      # Feature Flags
      - CREWAI_FEATURE_ENHANCED_TELEMETRY=true
      - CREWAI_FEATURE_SMART_CACHING=true

      # Metrics
      - CREWAI_METRICS_ENABLED=true
      - PROMETHEUS_MULTIPROC_DIR=/tmp/prometheus
    volumes:
      - ./:/app
      - crewai-data:/app/data
      - crewai-logs:/app/logs
    depends_on:
      - postgres
      - redis
    networks:
      - crewai-network
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ============================================================================
  # PostgreSQL Database
  # ============================================================================
  postgres:
    image: postgres:15-alpine
    container_name: crewai-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=crewai
      - POSTGRES_USER=crewai
      - POSTGRES_PASSWORD=crewai_password
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - crewai-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crewai"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # Redis (Caching & Rate Limiting)
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: crewai-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - crewai-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ============================================================================
  # Prometheus (Metrics Collection)
  # ============================================================================
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: crewai-prometheus
    restart: unless-stopped
    ports:
      - "9091:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    networks:
      - crewai-network
    depends_on:
      - crewai
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================================================
  # Grafana (Metrics Visualization)
  # ============================================================================
  grafana:
    image: grafana/grafana:10.0.0
    container_name: crewai-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=
      - GF_SERVER_ROOT_URL=http://localhost:3000
      - GF_ANALYTICS_REPORTING_ENABLED=false
    volumes:
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - grafana-data:/var/lib/grafana
    networks:
      - crewai-network
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================================================
  # pgAdmin (Database Management - Optional)
  # ============================================================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: crewai-pgadmin
    restart: unless-stopped
    ports:
      - "5050:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@crewai.local
      - PGADMIN_DEFAULT_PASSWORD=admin
      - PGADMIN_CONFIG_SERVER_MODE=False
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    networks:
      - crewai-network
    depends_on:
      - postgres
    profiles:
      - tools  # Only start with: docker-compose --profile tools up

  # ============================================================================
  # Redis Commander (Redis Management - Optional)
  # ============================================================================
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: crewai-redis-commander
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - REDIS_HOSTS=local:redis:6379
    networks:
      - crewai-network
    depends_on:
      - redis
    profiles:
      - tools  # Only start with: docker-compose --profile tools up

# ============================================================================
# Networks
# ============================================================================
networks:
  crewai-network:
    driver: bridge
    name: crewai-network

# ============================================================================
# Volumes (Persistent Data)
# ============================================================================
volumes:
  crewai-data:
    name: crewai-data
  crewai-logs:
    name: crewai-logs
  postgres-data:
    name: crewai-postgres-data
  redis-data:
    name: crewai-redis-data
  prometheus-data:
    name: crewai-prometheus-data
  grafana-data:
    name: crewai-grafana-data
  pgadmin-data:
    name: crewai-pgadmin-data
