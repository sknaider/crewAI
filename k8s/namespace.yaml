---
# ============================================================================
# Namespace - Isolated environment for CrewAI
# ============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: crewai
  labels:
    name: crewai
    environment: production
    team: platform-engineering
  annotations:
    description: "CrewAI production environment"
    contact: "support@crewai.com"

---
# ============================================================================
# ResourceQuota - Prevent resource exhaustion
# ============================================================================
apiVersion: v1
kind: ResourceQuota
metadata:
  name: crewai-quota
  namespace: crewai
spec:
  hard:
    requests.cpu: "20"
    requests.memory: "40Gi"
    limits.cpu: "40"
    limits.memory: "80Gi"
    persistentvolumeclaims: "5"
    services.loadbalancers: "2"

---
# ============================================================================
# LimitRange - Default resource limits for pods
# ============================================================================
apiVersion: v1
kind: LimitRange
metadata:
  name: crewai-limits
  namespace: crewai
spec:
  limits:
  # Pod limits
  - type: Pod
    max:
      cpu: "4"
      memory: "8Gi"
    min:
      cpu: "100m"
      memory: "128Mi"

  # Container limits
  - type: Container
    default:
      cpu: "500m"
      memory: "512Mi"
    defaultRequest:
      cpu: "250m"
      memory: "256Mi"
    max:
      cpu: "2"
      memory: "4Gi"
    min:
      cpu: "100m"
      memory: "128Mi"

  # PVC limits
  - type: PersistentVolumeClaim
    max:
      storage: "100Gi"
    min:
      storage: "1Gi"
