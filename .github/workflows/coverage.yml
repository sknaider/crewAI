name: Code Coverage

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write  # For posting coverage comments

env:
  OPENAI_API_KEY: fake-api-key
  PYTHONUNBUFFERED: 1

jobs:
  coverage:
    name: Generate Coverage Report
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for better coverage context

      - name: Restore global uv cache
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/uv
            ~/.local/share/uv
            .venv
          key: uv-coverage-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-coverage-

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.4"
          python-version: "3.12"
          enable-cache: false

      - name: Install dependencies
        run: uv sync --all-groups --all-extras

      - name: Run tests with coverage
        run: |
          cd lib/crewai && uv run pytest \
            --cov=crewai \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov \
            --cov-report=term \
            --cov-config=../../pyproject.toml \
            --block-network \
            --timeout=30 \
            -vv \
            -n auto

      - name: Run tools tests with coverage
        run: |
          cd lib/crewai-tools && uv run pytest \
            --cov=crewai_tools \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov \
            --cov-report=term \
            --cov-config=../../pyproject.toml \
            --cov-append \
            --block-network \
            --timeout=30 \
            -vv \
            -n auto

      - name: Combine coverage reports
        run: |
          uv run coverage combine lib/crewai/.coverage lib/crewai-tools/.coverage || true
          uv run coverage xml -o coverage.xml
          uv run coverage html -d htmlcov
          uv run coverage report --fail-under=80

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          files: ./lib/crewai/coverage.xml,./lib/crewai-tools/coverage.xml
          flags: unittests
          name: codecov-crewai
          fail_ci_if_error: true
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Generate coverage badge
        run: |
          COVERAGE=$(uv run coverage report | grep TOTAL | awk '{print $NF}' | sed 's/%//')
          echo "Coverage: ${COVERAGE}%"
          echo "COVERAGE=${COVERAGE}" >> $GITHUB_ENV

      - name: Comment PR with coverage
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const coverage = process.env.COVERAGE;
            const body = `## 📊 Code Coverage Report

            **Total Coverage:** ${coverage}%

            ${parseFloat(coverage) >= 80 ? '✅ Coverage meets the 80% threshold!' : '❌ Coverage is below the 80% threshold.'}

            <details>
            <summary>View detailed coverage report</summary>

            The full HTML coverage report has been generated and uploaded as an artifact.

            </details>

            ---
            *This comment was automatically generated by the coverage workflow.*
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: Upload coverage HTML report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 30

      - name: Check coverage threshold
        run: |
          uv run coverage report --fail-under=80 || {
            echo "::error::Code coverage is below 80% threshold"
            exit 1
          }

      - name: Save uv caches
        if: steps.cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/uv
            ~/.local/share/uv
            .venv
          key: uv-coverage-${{ hashFiles('uv.lock') }}
