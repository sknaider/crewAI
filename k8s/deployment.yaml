---
# ============================================================================
# CrewAI Deployment - Production-Ready Kubernetes Configuration
# ============================================================================
# This deployment includes:
# - High availability (3 replicas)
# - Rolling updates with zero downtime
# - Resource limits and requests
# - Health checks (liveness & readiness probes)
# - Security contexts (non-root)
# - Environment-based configuration
# ============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: crewai-service
  namespace: crewai
  labels:
    app: crewai
    component: service
    version: 1.5.0
    managed-by: kubernetes
  annotations:
    description: "CrewAI main service deployment"
    team: "platform-engineering"
    contact: "support@crewai.com"
spec:
  # High availability: 3 replicas for production
  replicas: 3

  # Deployment strategy: rolling update with zero downtime
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1        # Allow 1 extra pod during updates
      maxUnavailable: 0  # Ensure no downtime

  # Label selector for pods
  selector:
    matchLabels:
      app: crewai
      component: service

  # Pod template
  template:
    metadata:
      labels:
        app: crewai
        component: service
        version: 1.5.0
      annotations:
        # Prometheus scraping
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
        # Force pod restart on config changes
        checksum/config: "{{ include (print $.Template.BasePath \"/configmap.yaml\") . | sha256sum }}"
    spec:
      # Service account for RBAC
      serviceAccountName: crewai-sa

      # Security context for pod
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault

      # Init containers (if needed for migrations, setup, etc.)
      initContainers:
      - name: init-check-db
        image: busybox:1.36
        command: ['sh', '-c', 'echo "Database check passed"']
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          readOnlyRootFilesystem: true

      # Main application container
      containers:
      - name: crewai
        image: crewai:1.5.0
        imagePullPolicy: IfNotPresent

        # Ports
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        - name: metrics
          containerPort: 9090
          protocol: TCP

        # Environment variables
        env:
        - name: ENVIRONMENT
          value: "production"
        - name: CREWAI_LOG_LEVEL
          value: "INFO"
        - name: CREWAI_LOG_FORMAT
          value: "json"
        - name: CREWAI_METRICS_ENABLED
          value: "true"
        - name: PYTHONUNBUFFERED
          value: "1"

        # Environment from ConfigMap
        envFrom:
        - configMapRef:
            name: crewai-config

        # Secrets (API keys, credentials)
        env:
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: crewai-secrets
              key: openai-api-key
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: crewai-secrets
              key: anthropic-api-key
              optional: true

        # Resource limits and requests
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
            ephemeral-storage: "1Gi"
          limits:
            memory: "2Gi"
            cpu: "2000m"
            ephemeral-storage: "5Gi"

        # Liveness probe (is the container healthy?)
        livenessProbe:
          httpGet:
            path: /health/live
            port: http
            httpHeaders:
            - name: X-Health-Check
              value: "liveness"
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3

        # Readiness probe (can it accept traffic?)
        readinessProbe:
          httpGet:
            path: /health/ready
            port: http
            httpHeaders:
            - name: X-Health-Check
              value: "readiness"
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3

        # Startup probe (for slow starting containers)
        startupProbe:
          httpGet:
            path: /health/startup
            port: http
          initialDelaySeconds: 0
          periodSeconds: 10
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 30  # Allow up to 5 minutes for startup

        # Volume mounts
        volumeMounts:
        - name: data
          mountPath: /app/data
        - name: logs
          mountPath: /app/logs
        - name: config
          mountPath: /app/config
          readOnly: true
        - name: tmp
          mountPath: /tmp

        # Security context for container
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          readOnlyRootFilesystem: true

      # Volumes
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: crewai-data-pvc
      - name: logs
        emptyDir: {}
      - name: config
        configMap:
          name: crewai-config
      - name: tmp
        emptyDir: {}

      # Node selection (optional - for specific node pools)
      nodeSelector:
        workload-type: "application"

      # Tolerations (optional - for tainted nodes)
      tolerations:
      - key: "workload-type"
        operator: "Equal"
        value: "application"
        effect: "NoSchedule"

      # Affinity rules for high availability
      affinity:
        # Pod anti-affinity: spread across nodes
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - crewai
              topologyKey: kubernetes.io/hostname
        # Node affinity: prefer specific node types
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 50
            preference:
              matchExpressions:
              - key: node-type
                operator: In
                values:
                - compute-optimized

      # Graceful shutdown
      terminationGracePeriodSeconds: 30

---
# ============================================================================
# Service - Load Balancer for CrewAI
# ============================================================================
apiVersion: v1
kind: Service
metadata:
  name: crewai-service
  namespace: crewai
  labels:
    app: crewai
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
spec:
  type: LoadBalancer
  selector:
    app: crewai
    component: service
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP
  - name: https
    port: 443
    targetPort: http
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: metrics
    protocol: TCP
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800  # 3 hours

---
# ============================================================================
# Service - Internal (ClusterIP) for service-to-service communication
# ============================================================================
apiVersion: v1
kind: Service
metadata:
  name: crewai-internal
  namespace: crewai
  labels:
    app: crewai
spec:
  type: ClusterIP
  selector:
    app: crewai
    component: service
  ports:
  - name: http
    port: 8000
    targetPort: http
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: metrics
    protocol: TCP

---
# ============================================================================
# Horizontal Pod Autoscaler - Auto-scaling based on metrics
# ============================================================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: crewai-hpa
  namespace: crewai
  labels:
    app: crewai
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: crewai-service

  minReplicas: 3
  maxReplicas: 10

  # Scaling behavior
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300  # 5 minutes
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 2
        periodSeconds: 30
      selectPolicy: Max

  # Metrics for auto-scaling
  metrics:
  # CPU utilization target
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70

  # Memory utilization target
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80

  # Custom metric: HTTP requests per second
  - type: Pods
    pods:
      metric:
        name: http_requests_per_second
      target:
        type: AverageValue
        averageValue: "100"
