---
# ============================================================================
# Secrets - API Keys and Credentials (EXAMPLE - DO NOT COMMIT REAL SECRETS!)
# ============================================================================
# In production, use:
# 1. kubectl create secret from files
# 2. External Secrets Operator with AWS Secrets Manager
# 3. Sealed Secrets
# 4. HashiCorp Vault integration
# ============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: crewai-secrets
  namespace: crewai
  labels:
    app: crewai
type: Opaque
stringData:
  # LLM API Keys (base64 encode in production)
  openai-api-key: "REPLACE_WITH_ACTUAL_KEY"
  anthropic-api-key: "REPLACE_WITH_ACTUAL_KEY"
  google-api-key: "REPLACE_WITH_ACTUAL_KEY"

  # Database credentials
  database-url: "postgresql://user:password@postgres:5432/crewai"

  # Redis connection
  redis-url: "redis://redis:6379/0"

  # AWS credentials (if not using IRSA)
  aws-access-key-id: "REPLACE_WITH_ACTUAL_KEY"
  aws-secret-access-key: "REPLACE_WITH_ACTUAL_SECRET"

  # JWT secret
  jwt-secret: "REPLACE_WITH_RANDOM_SECRET"

---
